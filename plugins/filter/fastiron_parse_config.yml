DOCUMENTATION:
  name: fastiron_parse_config
  author: Jonathan Chapman (@glitchwrks)
  version_added: 0.1.0
  short_description: Parse a FastIron running configuration
  description:
    - Parses the output of C(show running-config) from a FastIron switch into the hostname,
      software version, system-max settings, VLANs, LAGs, VE addresses and MCT clusters it defines, and
      the port name, speed-duplex and dual-mode settings of its Ethernet interfaces.
    - Port ranges such as C(ethe 1/1/7 to 1/1/8) are expanded to individual ports.
    - A configuration that was already parsed is returned unchanged.
  options:
    _input:
      description: Configuration text, or a configuration already parsed by this filter.
      type: raw
      required: true

EXAMPLES: |
  - name: Get the running configuration
    ansible.netcommon.cli_command:
      command: show running-config
    register: running

  - name: List the VLANs carried by each LAG member
    ansible.builtin.debug:
      msg: "{{ (running.stdout | glitchwrks.fastiron.fastiron_parse_config).vlans }}"

RETURN:
  _value:
    description:
      - The parsed configuration.
      - Keys C(vlans) and C(ve_addresses) are keyed by VLAN or VE number, C(lags) and
        C(clusters) by name.
      - C(system_max) maps the system-max parameters the configuration sets, such as C(vlan), to their
        values. Parameters left at their defaults are not listed, because the running configuration does not
        show them.
      - C(interfaces) maps each port with an C(interface ethernet) block to C(name), C(speed_duplex) (both
        V(null) when not set) and C(dual_mode) (V(false), V(true) for the default VLAN, or a VLAN id).
        A deployed LAG's port names are read from the LAG's C(port-name NAME ethernet PORT) lines, and its
        secondary ports, which have no interface block of their own, get the primary port's C(speed_duplex).
      - Each cluster has C(id), C(rbridge_id), C(session_vlan), C(keep_alive_vlan), C(icl),
        C(peers), C(deployed) and C(clients).
    type: dict
