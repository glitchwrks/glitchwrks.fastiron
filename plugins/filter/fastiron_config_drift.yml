DOCUMENTATION:
  name: fastiron_config_drift
  author: Jonathan Chapman (@glitchwrks)
  version_added: 0.1.0
  short_description: Compare a FastIron running configuration with a model
  description:
    - Reports how a switch's running configuration differs from a model of its VLANs, LAGs, VE interface
      addresses and MCT clusters. See P(glitchwrks.fastiron.fastiron_model_config#filter) for the model.
    - Only the sections the model has are compared. Within them, VLANs, LAGs, clusters and cluster clients
      the switch has but the model does not are reported as warnings.
    - Ports are compared as sets, so their order and how ranges are written do not matter. Addresses are
      compared whether written with a prefix length or a netmask.
  positional: model
  options:
    _input:
      description: The running configuration, as text or parsed by
        P(glitchwrks.fastiron.fastiron_parse_config#filter).
      type: raw
      required: true
    model:
      description: The model.
      type: dict
      required: true

EXAMPLES: |
  - name: Get the running configuration
    ansible.netcommon.cli_command:
      command: show running-config
    register: running

  - name: Report what differs from the model
    ansible.builtin.debug:
      msg: "{{ running.stdout | glitchwrks.fastiron.fastiron_config_drift(model) | map(attribute='message') }}"

RETURN:
  _value:
    description:
      - A list of differences, empty when the switch matches the model.
      - Each has C(severity) (C(error) or C(warning)), C(rule), C(object) (such as C(vlan 1000)), C(message),
        and C(fixable), which is true when P(glitchwrks.fastiron.fastiron_config_commands#filter) generates
        commands for it.
      - Differences that need something removed, or a LAG or cluster changed in place, are not fixable, since
        that usually means undeploying it first.
    type: list
    elements: dict
