DOCUMENTATION:
  name: fastiron_config_drift
  author: Jonathan Chapman (@glitchwrks)
  version_added: 0.1.0
  short_description: Compare a FastIron running configuration with a model
  description:
    - Reports how a switch's running configuration differs from a model of its system-max settings, VLANs,
      LAGs, VE interface addresses, MCT clusters and Ethernet interface settings. See P(glitchwrks.fastiron.fastiron_model_config#filter) for the model.
    - Only the sections the model has are compared. Within them, VLANs, LAGs, clusters and cluster clients
      the switch has but the model does not are reported as warnings, as are system-max parameters the
      switch sets but the model does not. Only the interfaces, and the settings of each, that the model
      lists are compared.
    - Turning dual-mode off, or moving it to another VLAN, is reported but not fixable, because it changes which VLAN
      the port's untagged traffic lands in, so it is done by hand.
    - System-max settings are compared with the running configuration, which shows the configured value
      even before the reload that puts it into effect.
    - Ports are compared as sets, so their order and how ranges are written do not matter. Addresses are
      compared whether written with a prefix length or a netmask.
  positional: model
  options:
    _input:
      description: The running configuration, as text or parsed by
        P(glitchwrks.fastiron.fastiron_parse_config#filter).
      type: raw
      required: true
    model:
      description: The model.
      type: dict
      required: true
    remove:
      description:
        - What P(glitchwrks.fastiron.fastiron_config_removals#filter) is used to remove. Differences it
          fixes are reported as fixable.
      type: list
      elements: string
      choices:
        vlan_ports: Ports on VLANs in the model that the model does not list.
      default: []
    protected_vlans:
      description:
        - VLANs whose ports are never removed. Each cluster's session VLAN is always protected.
        - Extra ports on them are reported as not fixable.
      type: list
      elements: int
      default: []

EXAMPLES: |
  - name: Get the running configuration
    ansible.netcommon.cli_command:
      command: show running-config
    register: running

  - name: Report what differs from the model
    ansible.builtin.debug:
      msg: "{{ running.stdout | glitchwrks.fastiron.fastiron_config_drift(model) | map(attribute='message') }}"

RETURN:
  _value:
    description:
      - A list of differences, empty when the switch matches the model.
      - Each has C(severity) (C(error) or C(warning)), C(rule), C(object) (such as C(vlan 1000)), C(message),
        and C(fixable), which is true when P(glitchwrks.fastiron.fastiron_config_commands#filter), or for the
        kinds in O(remove), P(glitchwrks.fastiron.fastiron_config_removals#filter), generates commands for it.
      - Other differences that need something removed, or a LAG or cluster changed in place, are not fixable,
        since that usually means undeploying it first.
    type: list
    elements: dict
