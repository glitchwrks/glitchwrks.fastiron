DOCUMENTATION:
  name: fastiron_mct_audit
  author: Jonathan Chapman (@glitchwrks)
  version_added: 0.1.0
  short_description: Check a FastIron switch's MCT configuration for mistakes
  description:
    - Checks each MCT cluster in one switch's configuration against the rules in the Ruckus MCT
      design guide, for example that the session VLAN is tagged on every ICL port, that client VLANs
      are carried over the ICL, and that the keep-alive VLAN uses a separate link from the ICL.
    - Mistakes like these often only show up when a failover happens.
    - Use P(glitchwrks.fastiron.fastiron_mct_compare#filter) to check that both peers agree.
  options:
    _input:
      description: Configuration text, or a configuration parsed by
        P(glitchwrks.fastiron.fastiron_parse_config#filter).
      type: raw
      required: true

EXAMPLES: |
  - name: Get the running configuration
    ansible.netcommon.cli_command:
      command: show running-config
    register: running

  - name: Fail on MCT configuration errors
    vars:
      findings: "{{ running.stdout | glitchwrks.fastiron.fastiron_mct_audit }}"
    ansible.builtin.assert:
      that: findings | selectattr('severity', '==', 'error') | list | length == 0
      fail_msg: "{{ findings | map(attribute='message') }}"

RETURN:
  _value:
    description:
      - A list of findings, empty when nothing was found.
      - Each finding has C(severity) (C(error) or C(warning)), C(rule), C(cluster) and C(message).
    type: list
    elements: dict
