DOCUMENTATION:
  name: fastiron_parse_cluster_status
  author: Jonathan Chapman (@glitchwrks)
  version_added: 0.1.0
  short_description: Parse the output of FastIron's show cluster command
  description:
    - Parses the live state of a switch's MCT clusters, as shown by C(show cluster), including the
      cluster state, keep-alive reachability, ICL, peers and clients.
    - Lines that are not recognized are ignored, and fields that were not found are V(null).
    - P(glitchwrks.fastiron.fastiron_mct_health#filter) checks the result for problems.
  options:
    _input:
      description: The output of C(show cluster).
      type: string
      required: true

EXAMPLES: |
  - name: Get the live state of the MCT clusters
    ansible.netcommon.cli_command:
      command: show cluster
    register: cluster

  - name: Show the state of each cluster's peers
    ansible.builtin.debug:
      msg: "{{ (cluster.stdout | glitchwrks.fastiron.fastiron_parse_cluster_status).clusters
               | dict2items | map(attribute='value.peers') }}"

RETURN:
  _value:
    description:
      - A dictionary with one key, C(clusters), which maps each cluster name to its state.
      - Each cluster has C(id), C(rbridge_id), C(session_vlan), C(keep_alive_vlan), C(state)
        (for example V(Deploy)), C(client_isolation), C(member_vlans) and C(keep_alive_reachability)
        (for example V(Peer Reachable)).
      - C(icl) has C(name), C(port) and C(trunk).
      - C(peers) is a list; each peer has C(address), C(rbridge_id), C(icl), C(keep_alive_interval),
        C(hold_time), C(fast_failover), C(active_vlans), C(last_ccp_down_reason), C(ccp_down_reason)
        (only shown while the session is down), C(state) (for example V(CCP Up)) and C(state_detail).
      - C(clients_configured) is the number of clients the switch reports, and C(clients) maps each
        client name to its C(rbridge_id), C(config) (for example V(Deployed)), C(port), C(trunk) and
        C(state) (for example V(Up)).
    type: dict
