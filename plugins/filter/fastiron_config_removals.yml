DOCUMENTATION:
  name: fastiron_config_removals
  author: Jonathan Chapman (@glitchwrks)
  version_added: 0.1.0
  short_description: Generate the FastIron commands that remove ports a model does not list
  description:
    - Returns the configuration lines that remove tagged and untagged ports from VLANs in a model that the
      model does not list for them. See P(glitchwrks.fastiron.fastiron_model_config#filter) for the model.
    - Only ports on VLANs in the model are removed. VLANs, and anything else, are never removed.
    - A port removed from its last untagged VLAN goes back to the default VLAN.
    - Protected VLANs are left alone. Each cluster's session VLAN is always protected, since removing it
      from the ICL breaks the cluster's control link.
    - The lines are nested by indenting one space. Send them after the lines from
      P(glitchwrks.fastiron.fastiron_config_commands#filter), so ports are added before others are removed,
      with M(ansible.netcommon.cli_config) and O(ansible.netcommon.cli_config#module:diff_match=none).
  positional: model, protected_vlans
  options:
    _input:
      description: The running configuration, as text or parsed by
        P(glitchwrks.fastiron.fastiron_parse_config#filter).
      type: raw
      required: true
    model:
      description: The model.
      type: dict
      required: true
    protected_vlans:
      description: VLANs whose ports are never removed, in addition to each cluster's session VLAN.
      type: list
      elements: int
      default: []

EXAMPLES: |
  - name: Remove ports the model doesn't list, keeping the management VLAN
    vars:
      removals: "{{ running.stdout | glitchwrks.fastiron.fastiron_config_removals(model, protected_vlans=[10]) }}"
    ansible.netcommon.cli_config:
      config: "{{ removals | join('\n') }}"
      diff_match: none
    when: removals | length > 0

RETURN:
  _value:
    description: Configuration lines, such as C(vlan 3001) followed by C( no tagged ethe 1/1/7 to 1/1/8).
    type: list
    elements: str
