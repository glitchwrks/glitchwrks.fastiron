ancestor: null
releases:
  0.1.0:
    changes:
      release_summary: Initial release. Ansible support for Brocade / Ruckus FastIron
        switches over ``network_cli``, tested against ICX 6650 switches running FastIron
        08.0.30, with filters that check MCT cluster configurations for mistakes before
        a failover exposes them.
    fragments:
    - 0.1.0.yml
    modules:
    - description: Manage the SSH client public keys of a FastIron switch.
      name: fastiron_ssh_keys
      namespace: ''
    plugins:
      cliconf:
      - description: Cliconf plugin for Brocade / Ruckus FastIron switches.
        name: fastiron
        namespace: null
      filter:
      - description: Generate the FastIron commands that bring a switch closer to
          a model.
        name: fastiron_config_commands
        namespace: null
      - description: Compare a FastIron running configuration with a model.
        name: fastiron_config_drift
        namespace: null
      - description: Generate the FastIron commands that remove ports a model does
          not list.
        name: fastiron_config_removals
        namespace: null
      - description: Check a FastIron switch's MCT configuration for mistakes.
        name: fastiron_mct_audit
        namespace: null
      - description: Check that two FastIron MCT peers agree.
        name: fastiron_mct_compare
        namespace: null
      - description: Check the live state of a FastIron switch's MCT clusters.
        name: fastiron_mct_health
        namespace: null
      - description: Check the live state of two FastIron MCT peers together.
        name: fastiron_mct_health_compare
        namespace: null
      - description: Validate a FastIron configuration model.
        name: fastiron_model_config
        namespace: null
      - description: Parse the output of FastIron's show cluster command.
        name: fastiron_parse_cluster_status
        namespace: null
      - description: Parse a FastIron running configuration.
        name: fastiron_parse_config
        namespace: null
    release_date: '2026-10-28'
