---
minor_changes:
  - "fastiron_parse_config - parse the ``port-name``, ``speed-duplex`` and ``dual-mode`` settings of
    ``interface ethernet`` blocks into ``interfaces``."
  - "fastiron_model_config, fastiron_config_drift, fastiron_config_commands - a model can declare
    ``interfaces``, mapping ports to ``name``, ``speed_duplex`` and ``dual_mode``. Port names and
    speed-duplex are set before LAGs, so new LAG ports match before deploying, and dual-mode after VLANs,
    since it needs the port tagged. Turning dual-mode off or moving it to another VLAN is reported but
    left to be done by hand."
