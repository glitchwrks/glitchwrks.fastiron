name: ansible-test

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, to catch breakage from new ansible-core releases
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  sanity:
    name: Sanity (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible:
          - stable-2.19
          - stable-2.20
          - stable-2.21
          - devel
    continue-on-error: ${{ matrix.ansible == 'devel' }}
    steps:
      - uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: sanity
          test-deps: ansible.netcommon ansible.utils

  units:
    name: Units (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible:
          - stable-2.19
          - stable-2.20
          - stable-2.21
          - devel
    continue-on-error: ${{ matrix.ansible == 'devel' }}
    steps:
      - uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: units
          test-deps: ansible.netcommon ansible.utils
